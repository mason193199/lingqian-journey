  <body>
    <main class="app">
      <header class="site-header">
        <a class="brand" href="./" aria-label="靈籤小旅首頁"><span class="brand-seal">籤</span><span>靈籤小旅<small>THE LITTLE ORACLE</small></span></a>
        <div class="header-right"><span class="chapter-label">第一章 <i></i> 靈霧竹林</span><span class="edition">可玩原型 · 01</span></div>
      </header>
      <section class="game-shell" aria-label="靈籤小旅遊戲">
        <canvas id="game" width="1280" height="720" aria-label="遊戲畫面：使用 A D 移動、空白鍵跳躍、J 攻擊、K 衝刺" tabindex="0"></canvas>
        <div class="game-vignette" aria-hidden="true"></div>
        <div class="hud" id="hud">
          <div class="player-status"><div class="avatar" aria-hidden="true">☯</div><div><div class="status-caption">小旅人 <span>五行護佑</span></div><div id="health" aria-label="生命值">♥ ♥ ♥ ♥ ♥</div></div></div>
          <div class="journey-status"><span class="hud-label">此行 · 靈霧竹林</span><strong id="stage">循著竹影，向前走</strong></div>
          <div class="hud-actions"><button type="button" id="sound" aria-label="開關音效" title="開關音效">♪</button><button type="button" data-action="pause" aria-label="暫停遊戲" title="暫停 Esc">Ⅱ</button></div>
        </div>
        <div id="blessings" class="active-blessings" aria-label="已獲得祝福"></div>
        <div id="bossbar" class="boss-bar" hidden><div class="boss-caption"><span>竹魄守</span><span>靈霧竹林 · 守關者</span></div><div class="boss-track"><div id="bosshealth"></div></div></div>
        <div id="overlay" class="overlay">
          <div class="title-screen">
            <div class="chapter-kicker"><span></span> 一籤一旅，一念一生 <span></span></div>
            <div class="title-lockup"><span class="title-orbit" aria-hidden="true">☯</span><p class="vertical-note">東方奇幻冒險</p><h1>靈籤<span>小旅</span></h1><span class="title-seal">初<br>行</span></div>
            <p class="title-subtitle">THE LITTLE ORACLE</p>
            <p class="title-copy">竹林起霧了。帶上一張靈符，<br>與小小的勇氣，踏進命運的下一頁。</p>
            <button type="button" class="primary start-button" data-command="start"><span>啟程入林</span><span aria-hidden="true">→</span></button>
            <div class="chapter-badge"><span>壹</span> 靈霧竹林 <i>·</i> 一段完整的小冒險</div>
            <div class="title-controls"><span><kbd>A</kbd><kbd>D</kbd> 移動</span><span><kbd>Space</kbd> 跳躍</span><span><kbd>J</kbd> 靈符攻擊</span><span><kbd>K</kbd> 衝刺</span></div>
            <p class="touch-hint">手機建議橫向遊玩 · 支援多點觸控</p>
          </div>
        </div>

          <div class="touch-movement"><button type="button" data-action="left" aria-label="向左移動">◀</button><button type="button" data-action="right" aria-label="向右移動">▶</button></div>
          <div class="touch-skills"><button type="button" class="touch-dash" data-action="dash" aria-label="衝刺">衝<span>瞬身</span></button><button type="button" class="touch-jump" data-action="jump" aria-label="跳躍">躍</button><button type="button" class="touch-attack" data-action="attack" aria-label="普通攻擊">符<span>攻擊</span></button></div>
        </div>
